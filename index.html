<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pod Day: Telemetri Nöbeti</title>
<style>
:root{--bg:#0b1220;--card:#141d33;--ink:#e8edf7;--mut:#8fa0bf;--acc:#f59e0b;--ok:#22c55e;--bad:#ef4444;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:12px 16px}
h1{font-size:22px;margin:8px 0}h2{font-size:13px;color:var(--acc);letter-spacing:.06em;margin:0 0 6px}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px 0}
button{width:100%;text-align:left;background:#1d2a48;color:var(--ink);border:2px solid transparent;border-radius:12px;padding:14px;margin:6px 0;font:inherit;cursor:pointer}
button.sel{border-color:var(--acc)}button.go{background:var(--acc);color:#111;font-weight:700;text-align:center}button:disabled{opacity:.4}
.row{display:flex;gap:6px}.row button{text-align:center;padding:10px 4px;font-size:14px}
.hint,.tutor,.mut{font-size:14px;color:var(--mut)}.hint{border-left:3px solid var(--acc);padding-left:10px}
.timer{font-size:28px;font-weight:700;color:var(--acc);text-align:right}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #2c3b5e;background:#0b1220;color:var(--ink);font:inherit}
.ok{color:var(--ok)}.bad{color:var(--bad)}
#hd{background:#0e1730;border-radius:14px;padding:8px 12px;margin:8px 0}#hd svg{width:100%;height:56px;display:block}
#st{font-size:12px;font-weight:700;letter-spacing:.05em}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.bar span:first-child{width:110px;color:var(--mut)}
.bar i{flex:1;height:8px;background:#0b1220;border-radius:4px;overflow:hidden}.bar b{display:block;height:100%;transition:width .6s}
.log{font-size:13px;color:var(--mut);margin:0;padding-left:16px}.concept{background:#0e1730;border-radius:10px;padding:10px;margin:6px 0;font-size:14px}
</style></head><body><main>
<div id="hd"><div id="st" data-cy="status"></div><svg viewBox="0 0 300 44"><polyline id="pl" fill="none" stroke-width="2" points=""/></svg></div>
<div id="app"></div></main>
<script>
const LV=['Yeni başladım','Orta','Deneyimliyim'],RL=['Telemetri','Web arayüzü','Yer istasyonu'],GL=['Öğrenmek','Yarışa hazırlanmak','Mülakat'];
const RS=['Paket akışı senin sorumluluğunda: sensörden yer istasyonuna giden kanal sustu.','Operatör ekranındaki grafikler dondu, ekip sana bakıyor.','Yer istasyonu sunucusu cevap vermiyor, tüm veri senin üzerinden akıyordu.'];
const STT=[['Veri bütünlüğü','v','#22c55e'],['Güvenlik','g','#f59e0b'],['Zaman','z','#38bdf8']];
const D=[
{t:'KARAR 1 · MİMARİ',o:['Yer istasyonunu yeniden başlat','Yedek bağlantıya geç'],c:1,e:[[-30,-10,-20],[0,0,-10]],mode:['gap','live'],
 hint:'Akış kesilirken kapsülden gelen paketlere ne olur?',k:'Hata toleransı: yedeklilik ve yeniden bağlanma (reconnect) stratejisi',
 why:['Yeniden başlatma sırasında gelen paketler kaybolur; kapsül o sürede "kör" kalır.','Yedek kanal akışı sürdürür; paket kaybı en aza iner.'],
 q:['Yer istasyonunu yeniden başlatırsan o an kapsülden gelen paketlere ne olur?','Yeniden başlama süresi boyunca kapsülü kim izliyor olurdu?','"Yedeklilik" ve "yeniden bağlanma" kavramlarının burada ne işe yarayabileceğini düşün.']},
{t:'KARAR 2 · TEST',o:['Yamayı önce simülatörde dene','Doğrudan canlı sisteme yükle'],c:0,e:[[0,0,-15],[-20,-25,0]],mode:['live','live'],
 hint:'Yama yeni bir hata çıkarırsa bunu nerede görmek istersin?',k:'Test ortamı ve risk yönetimi: hatayı ucuz yerde yakala',
 why:['Simülatör riski kapsülden uzakta yakalar; dakika kaybedersin ama güvendesin.','Denenmemiş yama, kapsül hareket halindeyken yeni hata çıkarabilir.'],
 q:['Yamanın yeni bir hata çıkardığını hangi ortamda görmek istersin, neden?','Hata canlıda çıkarsa bedeli ne olur, simülatörde çıkarsa ne olur?','Dakikalar kıymetli, ama "geri alınamaz" bir hatayla nasıl kıyaslarsın?']},
{t:'KARAR 3 · GÜVENLİK',o:['Acil durdurma komutunu ver','"Birkaç saniye bekleyelim"'],c:0,e:[[0,0,-5],[-20,-40,0]],mode:['stop','blind'],
 hint:'Veri yokken sistemin güvenli durumu ne olmalı?',k:'Fail-safe tasarım: belirsizlikte güvenli duruma geç',
 why:['Fail-safe: veri yoksa sistem güvenli duruma (durdurma) geçer.','Kör bir kapsülü beklemek güvenlik riskidir; belirsizlikte güvenli tarafa gidilir.'],
 q:['Veri akışı yokken sistemin varsayılan davranışı ne olmalı ve neden?','Kapsülün durumunu bilmiyorsan en kötü senaryo ne ve hangi taraf güvenli?','"Fail-safe" ne demek, burada hangi seçenek buna uyar?']}];
let S={},mode='lost',tick=0,tm=null;const $=id=>document.getElementById(id);
const SM={lost:['AKIŞ KESİK','#ef4444'],gap:['YENİDEN BAŞLIYOR · PAKET KAYBI','#f59e0b'],live:['YEDEK KANAL · CANLI','#22c55e'],stop:['KAPSÜL DURDU · GÜVENLİ','#22c55e'],blind:['KÖR UÇUŞ · RİSK','#ef4444']};
setInterval(()=>{tick++;S.p=S.p||[];let y=22;
 if(mode=='live')y=22+9*Math.sin(tick/3)+Math.random()*6;else if(mode=='gap')y=(tick%24<12)?22:22+(Math.random()-.5)*30*((tick%24<18)?0:1);
 else if(mode=='blind')y=22+(Math.random()-.5)*34;else if(mode=='stop')y=40;
 S.p.push(y);if(S.p.length>60)S.p.shift();const[m,c]=SM[mode];
 $('pl').setAttribute('points',S.p.map((v,i)=>`${i*5},${v.toFixed(1)}`).join(' '));$('pl').setAttribute('stroke',c);
 $('pl').setAttribute('stroke-dasharray',mode=='lost'?'4 3':'0');$('st').textContent=m;$('st').style.color=c},120);
function bars(){return STT.map(([n,k,c])=>`<div class="bar" data-cy="stat-${k}"><span>${n}</span><i><b style="width:${Math.max(0,S[k])}%;background:${c}"></b></i><span>${Math.max(0,S[k])}</span></div>`).join('')}
function intro(){const p=S.p;S={lv:null,rl:null,gl:null,i:0,score:0,v:100,g:100,z:100,clock:840,log:[],p};mode='lost';
 const grp=(k,t,a)=>`<div class="card"><h2>${t}</h2><div class="row">${a.map((x,j)=>`<button data-cy="${k}-${j}" onclick="pick('${k}',${j})" id="${k}${j}">${x}</button>`).join('')}</div></div>`;
 $('app').innerHTML=`<h1>Pod Day: Telemetri Nöbeti</h1><p class="hint">Hyperloop test günü, karar senin. Önce 3 soru:</p>${grp('level','SEVİYE',LV)}${grp('role','ROL',RL)}${grp('goal','HEDEF',GL)}<button class="go" id="start" data-cy="start" disabled onclick="scene()">Nöbete başla</button>`}
function pick(k,j){const m={level:'lv',role:'rl',goal:'gl'}[k];S[m]=j;[0,1,2].forEach(x=>$(k+x).classList.toggle('sel',x==j));$('start').disabled=S.lv==null||S.rl==null||S.gl==null}
const clk=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function scene(){clearInterval(tm);const d=D[S.i];S.n=0;
 const sc=S.i==0?`<div class="card"><h2>SAHNE · ${clk(S.clock)}</h2>Kapsül test hattında, telemetri akışı kesildi. <b>${RL[S.rl]}</b> tarafındaki nöbetçi sensin. ${RS[S.rl]}</div>`:`<div class="card"><h2>SAHNE · ${clk(S.clock)}</h2><span class="mut">Durum güncellendi, sıradaki karar:</span></div>`;
 $('app').innerHTML=`${sc}<div class="card">${bars()}</div><div class="card"><h2>${d.t}</h2><div id="timer" class="timer" data-cy="timer"></div>${d.o.map((x,j)=>`<button data-cy="choice-${j}" onclick="choose(${j})">${String.fromCharCode(65+j)}) ${x}</button>`).join('')}${S.lv==0?`<p class="hint" data-cy="hint">İpucu: ${d.hint}</p>`:''}</div>
 <div class="card tutor"><h2>AI TUTOR</h2><input id="ti" data-cy="tutor-input" placeholder="Tutor'a yaz..."><button data-cy="tutor-send" onclick="tutor()">Sor</button><p id="tr" data-cy="tutor-reply"></p></div>`;
 if(S.lv==2){let t=60;$('timer').textContent=t;tm=setInterval(()=>{t--;$('timer').textContent=t;if(t<=0){clearInterval(tm);choose(-1)}},1000)}}
function tutor(){const v=$('ti').value.toLowerCase(),d=D[S.i];const ask=/doğru|söyle|hangisi|cevap|a mı|b mi/.test(v);
 const q=d.q[Math.min(S.n,2)];S.n++;$('tr').textContent=(ask?'Cevabı söylemem, ama şunu düşün: ':'Bir soru: ')+q;$('ti').value=''}
function choose(j){clearInterval(tm);const d=D[S.i];const late=j==-1;if(late)j=1-d.c;const right=j==d.c;if(right)S.score++;
 const e=d.e[j];S.v+=e[0];S.g+=e[1];S.z+=e[2];const mins=Math.max(1,Math.round(-e[2]/5));S.clock+=mins;mode=d.mode[j];
 S.log.push(`${clk(S.clock)} · ${d.o[j]}${late?' (süre doldu)':''} → ${right?'doğru':'riskli'}`);
 $('app').innerHTML=`<div class="card" data-cy="why"><h2>NE OLDU, NEDEN OLDU</h2><p class="${right?'ok':'bad'}">${late?'Süre doldu, karar verilemedi. ':''}${right?'Doğru karar.':'Riskli karar.'}</p><p>${d.why[j]}</p><p class="mut">Bu karar ${mins} dk sürdü. Saat ${clk(S.clock)}.</p>${bars()}<button class="go" data-cy="next" onclick="next()">Devam</button></div>`}
function next(){S.i++;S.i<3?scene():end()}
function end(){const a=S.score>=2;
 const gt=['her karardaki "neden" kısmını tekrar oku.','simülatör ve yedek kanal adımlarını yarış öncesi kontrol listene ekle.','kararlarını "hata toleransı, test ortamı, fail-safe" kavramlarıyla anlatmaya çalış.'][S.gl];
 $('app').innerHTML=`<div class="card" data-cy="end-${a?'A':'B'}"><h2>${a?'SON A · İYİ':'SON B · KÖTÜ'}</h2><p>${a?'Kapsül güvenle durdu, veri kaydı korundu.':'Kapsül durdu ama veri kaybı ve güvenlik riski oluştu.'}</p><p data-cy="score">Doğru karar: ${S.score}/3 · Bitiş saati ${clk(S.clock)}</p>${bars()}</div>
 <div class="card"><h2>ZAMAN ÇİZELGESİ</h2><ul class="log">${S.log.map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <div class="card"><h2>KAVRAM KARTLARI</h2>${D.map(d=>`<div class="concept">${d.k}</div>`).join('')}<p class="hint">Hedefin "${GL[S.gl]}": ${gt}</p></div><button class="go" data-cy="restart" onclick="intro()">Tekrar oyna</button>`}
intro();
</script></body></html>
